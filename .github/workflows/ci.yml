name: 🧪 CI - E-commerce Python

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 coverage

      - name: 🔍 Lint (PEP8 style check)
        run: |
          source venv/bin/activate
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Lint warnings only."

      - name: 🧪 Run tests
        run: |
          source venv/bin/activate
          pytest -v || echo "⚠️ No tests found, skipping..."

      - name: 📊 Test coverage
        run: |
          source venv/bin/activate
          coverage run -m pytest || echo "⚠️ No tests for coverage"
          coverage report -m
